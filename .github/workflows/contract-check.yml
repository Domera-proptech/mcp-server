name: Contract check

# A silent backend change must not leave the MCP server (and the directory listings built on it) out of step.
on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Live contract check (backend and mcp.domera.se)
        run: node scripts/live-contract.mjs
